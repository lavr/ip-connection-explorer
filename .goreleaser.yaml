version: 2

project_name: ipcx

builds:
  - id: ipcx
    main: ./cmd/ipcx
    binary: ipcx
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - id: ipcx
    formats: [tar.gz]
    name_template: "ipcx_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
