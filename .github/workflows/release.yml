name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Build and smoke test before anything is published, so a broken build never
      # reaches the release page.
      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke test the build
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf dist/ipcx_*_linux_amd64.tar.gz -C smoke
          ./smoke/ipcx --version
          ./smoke/ipcx merge testdata/a.json.gz testdata/b.json.gz -o /tmp/m.json.gz
          ./smoke/ipcx report /tmp/m.json.gz --format csv > /tmp/report.csv
          head -1 /tmp/report.csv | grep -q '^role_status,'
          ls dist/ipcx_*_linux_arm64.tar.gz
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
      - name: Publish
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the published build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/ipcx_*_linux_amd64.tar.gz -C smoke ipcx
          ./smoke/ipcx --version | grep -F "${GITHUB_REF_NAME}"
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
