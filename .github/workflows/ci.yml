name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.3.1
        with:
          install-go: false
      - run: go test -race ./...
      - run: make cross

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Environment
        run: |
          uname -r
          echo "runner image: $ImageOS $ImageVersion"
      - name: Install nftables
        run: command -v nft || sudo apt-get install -y nftables
      - run: make integration
