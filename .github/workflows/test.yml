name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "2025.1.1"
          install-go: false
      - name: Test
        run: go test -race ./...
      - name: Load test (open-loop generator, 10k events/s)
        run: IPCX_LOAD=1 go test -count=1 -run TestPipelineSustainsRate -v ./internal/collector/
      - name: Cross build
        run: make cross

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Environment
        run: |
          uname -r
          echo "runner image: $ImageOS $ImageVersion"
      - name: Install nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y nftables)
      - name: Integration test
        run: make integration
