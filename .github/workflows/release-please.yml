name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      # Build and smoke test before anything is uploaded, so a broken build never reaches
      # the release. The release itself already exists (created by release-please).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke test the build
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf dist/ipcx_*_linux_amd64.tar.gz -C smoke
          ./smoke/ipcx --version
          ./smoke/ipcx merge testdata/a.json.gz testdata/b.json.gz -o /tmp/m.json.gz
          ./smoke/ipcx report /tmp/m.json.gz --format csv > /tmp/report.csv
          head -1 /tmp/report.csv | grep -q '^role_status,'
          ls dist/ipcx_*_linux_arm64.tar.gz
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the published build
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          tar -xzf dist/ipcx_*_linux_amd64.tar.gz -C smoke ipcx
          ./smoke/ipcx --version | grep -F "${TAG#v}"
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
