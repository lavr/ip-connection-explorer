name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the amd64 archive
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          mkdir smoke
          tar -xzf dist/ipcx_*_linux_amd64.tar.gz -C smoke
          ./smoke/ipcx --version | grep -F "${TAG#v}"
          ./smoke/ipcx merge testdata/a.json.gz testdata/b.json.gz -o /tmp/m.json.gz
          ./smoke/ipcx report /tmp/m.json.gz --format csv | head -1 | grep -q '^role_status,'
      - name: Check the arm64 archive and checksums
        run: |
          set -eu
          ls dist/ipcx_*_linux_arm64.tar.gz
          cd dist && sha256sum --check --ignore-missing checksums.txt
